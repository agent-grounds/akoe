grund_config_version = 2
project_name = "akoe"

[schema]
marker = "§"
shorthand = "canonical"
id_format = "{kind}-{slug}"
slug_pattern = "[a-z][a-z0-9-]*"
number_pattern = "\\d+"
section_separator = "."
heading_depth = "must"

[schema.sources]
languages = ["v1_markdown", "v1_c_family", "v1_go", "v1_python", "v1_ruby", "v1_lisp", "v1_sql", "v1_haddock", "v1_ldoc", "v1_plain"]
declarations = "any-comment"
exclude = ["target/", "node_modules/", ".git/", "dist/", "build/", ".venv/"]
respect_gitignore = true

[schema.sources.extensions]
md = "v1_markdown"
rs = "v1_c_family"
go = "v1_go"
java = "v1_c_family"
kt = "v1_c_family"
ts = "v1_c_family"
tsx = "v1_c_family"
js = "v1_c_family"
py = "v1_python"
c = "v1_c_family"
cpp = "v1_c_family"
swift = "v1_c_family"
scala = "v1_c_family"
rb = "v1_ruby"
php = "v1_c_family"
cs = "v1_c_family"
lisp = "v1_lisp"
scm = "v1_lisp"
clj = "v1_lisp"
sql = "v1_sql"
hs = "v1_haddock"
lhs = "v1_haddock"
lua = "v1_ldoc"
ada = "v1_plain"
adb = "v1_plain"
ads = "v1_plain"

[schema.sources.definitions.v1_markdown]
class = "document"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_c_family]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "c-family"
docstrings = "off"

[schema.sources.definitions.v1_go]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "go"
docstrings = "off"

[schema.sources.definitions.v1_python]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "python"
docstrings = "python"

[schema.sources.definitions.v1_ruby]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "ruby"
docstrings = "off"

[schema.sources.definitions.v1_lisp]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "lisp"
docstrings = "off"

[schema.sources.definitions.v1_sql]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "sql"
docstrings = "off"

[schema.sources.definitions.v1_haddock]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "haddock"
docstrings = "off"

[schema.sources.definitions.v1_ldoc]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "ldoc"
docstrings = "off"

[schema.sources.definitions.v1_plain]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.notes.lines]
must = 3
may = 1

[schema.notes.columns]
must = 100

[schema.notes.text]
must = true

[schema.kinds.GRUND]
files = ["docs/grund.md"]

[schema.kinds.FS]
folders = ["docs/functional-spec"]

[schema.kinds.AR]
folders = ["docs/architecture"]

[schema.kinds.DF]
folders = ["docs/decisions/functional"]

[schema.kinds.DA]
folders = ["docs/decisions/architectural"]

# A test cites the document whose claim it proves, and is never cited back — so
# the two test kinds are `citable = false`: a home and citation directions, no ID
# namespace.
[schema.kinds.e2e]
folders = ["tests/e2e"]
citable = false

[schema.kinds.integration]
folders = ["tests/integration"]
citable = false

[schema.kinds.code]
files = ["README.md", "AGENTS.md"]
folders = ["docs"]

# Citation directions: which kinds may cite which, with RFC-2119 levels. Entries
# in one array are all required; `|` inside one entry means any one alternative.
# must/must-not gate `grund check`; should/should-not surface under
# `grund check --suggestions`. Specs climb to the grund; there is no GOAL kind,
# because Akoe serves the workspace's intake and claims no direction of its own.
[rules.citations]
default = "may"

[rules.citations.FS]
should = ["GRUND|FS"]
must-not = ["AR"] # the What may never depend on the How

[rules.citations.AR]
should = ["FS"]

[rules.citations.DF]
should = ["FS|GRUND"]

[rules.citations.DA]
should = ["AR|FS|GRUND"]

[rules.citations.e2e]
must = ["FS"] # a scenario proves a spec…
should-not = ["AR"] # …and sees the product as a user does

[rules.citations.integration]
should = ["AR"]

[rules.citations.code]
should = ["FS|AR"]

[rules.citations.grounding]
must = "file"

[presentation]
description = "A message gateway that turns mail and chat accounts into ephor forge sources"
trigger = "$$"
rules = "root"

[presentation.kinds.GRUND]
title = "Why: project motivation"

[presentation.kinds.FS]
title = "What: behavior, requirements, and constraints"

[presentation.kinds.AR]
title = "How: high-level implementation, structure, and design"

[presentation.kinds.DF]
title = "Product behavior decisions and tradeoffs"

[presentation.kinds.DA]
title = "Architecture decisions and tradeoffs"

[presentation.kinds.e2e]
title = "User scenarios: black-box proof of the spec"

[presentation.kinds.integration]
title = "Integration tests: proof that the parts fit as designed"

[presentation.fmt]
anchors = "github" # github | gitlab | mkdocs | pandoc | none
links = "index"
exclude = []
